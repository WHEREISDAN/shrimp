[package]
name = "shrimp"
version = "0.1.0"
description = "Speech to text, anywhere"
authors = ["Dantavious Williams"]
edition = "2024"
rust-version = "1.90"

[features]
# Windows release builds: Whisper on the GPU through whisper.cpp's Vulkan backend,
# with the CPU as fallback. Needs the Vulkan SDK (VULKAN_SDK) and a short target
# directory (see docs/DEVELOPMENT.md).
vulkan = ["whisper-rs/vulkan"]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "shrimp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Dev-only AI debugging bridge; registered behind cfg(debug_assertions) in lib.rs.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "c7d271a06469bdf4744bfdeadca7458a1f3d02e5" }
hound = "3.5.1"
rubato = "5.0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
cpal = "0.18.2"
whisper-rs = "0.16.0"
handy-keys = "0.3.4"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
sha2 = "0.10"
rusqlite_migration = "2.6"
keyring = "4.2.0"
rusqlite = { version = "0.40", features = ["bundled"] }
hanconv = "0.5.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
tauri-nspanel = "2.1.1"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSArray", "NSURL", "NSLocale", "NSPathUtilities"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFData", "CFArray", "CFDictionary", "CFNumber", "CFBase", "CFPreferences", "CFURL", "CFMachPort", "CFRunLoop"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSSound", "libc"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGSession"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "hidsystem"] }
libc = "0.2"
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "AXUIElement", "AXError", "AXValue", "AXValueConstants", "AXAttributeConstants", "AXRoleConstants", "HIServices", "libc"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt"] }
